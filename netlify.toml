[build]
  command = "npm run build"
  # Nitro's "netlify" preset (auto-selected via the NETLIFY env var in
  # nuxt.config.ts) outputs static assets to dist/ and the SSR function to
  # .netlify/functions-internal/ — NOT .output/public (that's only the
  # default node-server preset's output path, used for local/self-hosted
  # builds where NETLIFY isn't set).
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Legacy PHP endpoints still served by the old server (178.62.196.229).
# Proxied (status 200) so https://wyciag-karpacz.pl/<file>.php keeps working
# for external tools and the thermometers (which POST readings) after DNS
# moves to Netlify.
[[redirects]]
  from = "/current_temp_show.php"
  to = "https://old.wyciag-karpacz.pl/current_temp_show.php"
  status = 200
  force = true

[[redirects]]
  from = "/current_temp_show_dancio.php"
  to = "https://old.wyciag-karpacz.pl/current_temp_show_dancio.php"
  status = 200
  force = true

[[redirects]]
  from = "/current_temp.php"
  to = "https://old.wyciag-karpacz.pl/current_temp.php"
  status = 200
  force = true

[[redirects]]
  from = "/current_temp_dancio.php"
  to = "https://old.wyciag-karpacz.pl/current_temp_dancio.php"
  status = 200
  force = true

