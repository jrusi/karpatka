[build]
  command = "npm run build"
  # Nitro's "netlify" preset (auto-selected via the NETLIFY env var in
  # nuxt.config.ts) outputs static assets to dist/ and the SSR function to
  # .netlify/functions-internal/ — NOT .output/public (that's only the
  # default node-server preset's output path, used for local/self-hosted
  # builds where NETLIFY isn't set).
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Redirects from the old wyciag-karpacz.pl URL structure to the new site.
# Add one [[redirects]] block per old URL below.
[[redirects]]
  from = "/kamera-2-na-zywo/"
  to = "/kamery"
  status = 301
  force = true

[[redirects]]
  from = "/aktualnosci/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/cennik/"
  to = "/#cennik"
  status = 301
  force = true

[[redirects]]
  from = "/galeria/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/kontakt/"
  to = "/#kontakt"
  status = 301
